<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bedtime Stories | Little Lamb Stories</title>
  <meta name="description" content="Short, calm stories for winding down together.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Nunito:wght@500;650;750;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <section class="page-hero">
    <div class="wrap">
      <div class="banner">
        <p class="kicker">Story shelf</p>
        <h1 class="page-title">Bedtime Stories</h1>
        <p>Short, calm stories for winding down together.</p>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all" type="button">All episodes</button>
        <button class="filter-btn" data-filter="together" type="button">Watch together</button>
        <button class="filter-btn" data-filter="kids" type="button">For little ones</button>
        <button class="filter-btn" data-filter="short" type="button">Under 3 minutes</button>
      </div>
      <div class="grid-cards" id="category-grid" data-category="bedtime"></div>
    </div>
  </section>
  <footer class="site-footer" id="site-footer"></footer>
  <div class="mobile-sub" id="mobile-sub"></div>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
