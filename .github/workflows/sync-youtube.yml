name: Sync YouTube premieres

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-youtube
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync YouTube content
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_TIME_ZONE: ${{ vars.YOUTUBE_TIME_ZONE }}
          YOUTUBE_CATEGORY_PLAYLISTS: ${{ vars.YOUTUBE_CATEGORY_PLAYLISTS }}
        run: node scripts/sync-youtube.cjs
      - name: Commit generated content
        run: |
          git config user.name "little-lamb-sync[bot]"
          git config user.email "little-lamb-sync[bot]@users.noreply.github.com"
          git add js/data.js stories
          git diff --cached --quiet || git commit -m "Sync YouTube premieres and episodes"
          git push
